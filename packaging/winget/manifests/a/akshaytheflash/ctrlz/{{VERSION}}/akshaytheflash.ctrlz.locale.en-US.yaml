ShortDescription: Undo coding-agent edits by restoring your working tree to an earlier snapshot
Description: ctrlz is a local shadow store for your working tree. It snapshots a repository before each agent turn and `ctrlz undo` puts the tree back exactly as it was, including tracked files, untracked files and ignored-but-real files that git does not cover. There is no daemon, no network and no account.
