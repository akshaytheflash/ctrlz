[package]
name = "ctrlz"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A local shadow store for undoing coding-agent edits"
license = "MIT"
repository = "https://github.com/akshaytheflash/ctrlz"
homepage = "https://github.com/akshaytheflash/ctrlz"
readme = "README.md"
keywords = ["agent", "undo", "snapshot", "filesystem", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The repository carries launch-video frames and packaging manifests that do
# not belong in the crate source. Without this list the tarball is ~34 MB and
# crates.io rejects it.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
notify = "8"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
zstd = "0.14"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

# `guard start` must not leak the parent's stdout/stderr pipe into the
# detached watcher, or a piped caller waits for EOF forever.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
