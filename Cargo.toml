[package]
name = "ctrlz"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A local shadow store for undoing coding-agent edits"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
notify = "8"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
zstd = "0.14"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
